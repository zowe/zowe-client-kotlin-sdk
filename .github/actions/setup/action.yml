name: "Setup action"
description: "Prepares for execution - set up Java, Kotlin, Gradle"

inputs:
  jdkVersion:
    description: "JDK version"
    required: false
    default: "17"

runs:
  using: "composite"
  steps:
    - name: Set up JDK ${{ inputs.jdkVersion }}
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.jdkVersion }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash

    - name: Cache Gradle packages
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # Checks gradle-wrapper.jar against the checksums of the official Gradle releases,
    # so that a tampered wrapper JAR can never be executed by the build
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
