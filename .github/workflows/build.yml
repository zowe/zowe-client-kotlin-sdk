name: Build + Test + Sonar

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.ZOWE_ROBOT_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Build with Gradle
        run: ./gradlew build

      - name: Prepare lib Artifact
        id: artifact
        shell: bash
        run: |
          cd ${{ github.workspace }}/build/libs
          FILENAME=`ls | grep -vE '(-javadoc|-sources)\.jar$'`
          echo "filename=${FILENAME:0:-4}" >> $GITHUB_OUTPUT
          echo "zip artifact name:"
          echo "$FILENAME"

      - name: Publish built lib to artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/libs/*

      - name: Test with Gradle
        run: ./gradlew test

      - name: Publish tests result to artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-report-${{ steps.artifact.outputs.filename }}
          path: ${{ github.workspace }}/build/reports/*

      - name: Publish results to SonarCloud
        run: >
          ./gradlew --info sonar
          -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=512m"
          -Dresults="build/reports/tests/test,build/test-results"
          -Psonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.organization=zowe
          -Dsonar.coverage.jacoco.xmlReportPaths="build/reports/jacoco.xml"
          -Dsonar.projectKey=zowe_zowe-client-kotlin-sdk
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: ./.github/actions/teardown
